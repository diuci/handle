<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <meta name="description" content="汉兜：每天一个成语，用声母、韵母、声调十次机会把它猜出来。汉字 Wordle 的丢词夺理复刻站。">

  <meta property="og:url" content="https://handle.diuci.com/">

  <meta property="og:title" content="汉兜 · 汉字 Wordle">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://handle.diuci.com/og.png">
  <meta name="theme-color" content="#f4ede0" id="metaTheme">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <script>
    /* 首次绘制前定色：与 _deploy/core/theme.mjs 的 BOOTSTRAP 同源（check-core R4 钉特征）。
       键与主站 / K12 一致：dc-theme；MutationObserver 让切主题时地址栏色同步。 */
    ;(function () {
      var t = document.documentElement
      var m = document.querySelector('meta[name="theme-color"]')
      var saved = null
      try { saved = localStorage.getItem('dc-theme') } catch (e) {}
      var mode = saved === 'dark' || saved === 'light'
        ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      t.setAttribute('data-theme', mode)
      t.classList.toggle('dark', mode === 'dark')
      t.classList.toggle('light', mode === 'light')
      var sync = function () { if (m) m.setAttribute('content', t.getAttribute('data-theme') === 'dark' ? '#17140f' : '#f4ede0') }
      sync()
      if (m && window.MutationObserver) new MutationObserver(sync).observe(t, { attributes: true, attributeFilter: ['data-theme'] })
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
