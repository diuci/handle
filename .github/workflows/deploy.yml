name: 构建并部署汉兜

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 体检脚本自检
        # 先证明检查本身会失败。空过的检查比没有检查更危险。
        run: |
          node tools/check-legal.mjs --selftest
          node tools/check-build.mjs --selftest
          node tools/check-theme.mjs --selftest
          node tools/smoke-handle.mjs --selftest
          node tools/verse-lib.mjs --selftest
          node tools/sync-poems.mjs --selftest
          node tools/build-verse.mjs --selftest
          node tools/audit-verse.mjs --selftest
          node tools/check-verse.mjs --selftest

      - name: 单元测试
        run: npm run test

      - name: 诗句产物体检
        # 不联网：查已提交的诗库快照、词库、钉死读音是否自洽，历史答案有没有被动过
        run: |
          npm run check:verse
          npm run audit:verse -- --check

      - name: 构建
        run: npm run build

      - name: 法律护栏
        run: npm run check:legal

      - name: 产物体检
        run: npm run check:build

      - name: 主题体检
        run: npm run check:theme

      - name: 冒烟：真开浏览器把当天这题猜对
        run: |
          npm run preview -- --port 4173 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4173/ >/dev/null
          node tools/smoke-handle.mjs --url=http://127.0.0.1:4173

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
